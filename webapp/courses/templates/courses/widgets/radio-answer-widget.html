{% load static %}

{% for choice in choices %}
  <div class="input-label-container">
    <input type="radio"
           name="{{ content_slug }}-radio"
           id="mce-{{ choice.id }}"
           value="{{ choice.id }}"
           class="task_radio">
    <label for="mce-{{ choice.id }}">{{ choice.answer }}</label>
    <span class="multichoice-config-actions">
      <a class="staff-only collapsed right-float"
        onclick="editing.get_form(event, this)"
        data-url="{% url 'courses:add_exercise_choice' course instance content choice.id %}"
        ><img src="{% static 'courses/expand-16.png' %}"></a>
      <a class="staff-only collapsed right-float"
        onclick="editing.delete_item(event, this)"
        data-url="{% url 'courses:delete_exercise_choice' course instance content choice.id %}"
        ><img src="{% static 'courses/delete-16.png' %}"></a>
      <a class="staff-only collapsed right-float"
        onclick="editing.move_item(event, this, 'down')"
        data-url="{% url 'courses:move_exercise_choice' course instance content choice.id 'down' %}"
        ><img src="{% static 'courses/drop_after.png' %}"></a>
      <a class="staff-only collapsed right-float"
        onclick="editing.move_item(event, this, 'up')"
        data-url="{% url 'courses:move_exercise_choice' course instance content choice.id 'up' %}"
        ><img src="{% static 'courses/drop_before.png' %}"></a>
      <a class="staff-only collapsed right-float"
        onclick="editing.get_form(event, this)"
        data-url="{% url 'courses:edit_exercise_choice' course instance content choice.id %}"
        ><img src="{% static 'courses/edit.png' %}"></a>
    </span>
  </div>
{% endfor %}
