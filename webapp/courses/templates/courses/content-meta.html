{% load static %}
{% load i18n %}
{% load course_tags %}
<div class="task-meta-container">
  <div class="task-meta">
    {% if user.is_active and user.is_staff %}
      <hr>
      
      <div class="admin-tools">
        <div><b>{% trans "Teacher’s tools" %}</b></div>
        <ul>
          <li><div>
            <a id="{{ content.slug }}-regen-panel-link"
               class="regen-panel-link"
               href="{% url 'courses:regen_page_cache' course instance content %}"
               title="{% trans 'Open cache regen panel' %}"
               onclick="show_panel(event, this, 'regen-panel', 'message-panel');"
               data-querystring="">{% trans 'Regenerate cache' %}
            </a>
          </div></li>
          <li><div><a href="{{ content.get_admin_change_url }}">
            {% trans 'Edit this lecture' %}
          </a></div></li>
          {% content_menu_extra content %}
        </ul>
      </div>
    {% endif %}
    
  </div>
</div>
