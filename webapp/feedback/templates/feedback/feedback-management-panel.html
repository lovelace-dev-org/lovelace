{% load i18n %}
{% load static %}

<div class="panel-content" data-refresh-url="{{ panel_refresh_url }}">
  <div class="expand-handle"
      onclick="editing.get_form(event, this)"
      data-url="{% url 'feedback:edit_content_feedback' course instance content %}">
        {% trans 'Select feedback questions' %}
  </div>

  <div>Feedback Questions</div>

  <div>
    {% for question in questions %}
      <div class="item-header">
        {{ question.question }}
        <span class="answer-config-actions">
          <a class="right-float interactive"
              onclick="editing.get_form(event, this)"
              data-url="{% url 'feedback:delete_feedback_question' course instance question %}"
              ><img src="{% static 'courses/delete-16.png' %}"></a>
          <a class="right-float interactive"
              onclick="editing.get_form(event, this)"
              data-url="{% url 'feedback:edit_feedback_question' course instance question %}"
              ><img src="{% static 'courses/edit.png' %}"></a>
        </span>
      </div>
    {% endfor %}
    <div>
      <button type="button"
              class="staff-base-button add-button"
              onclick="editing.get_form(event, this)"
              data-url="{% url 'feedback:create_feedback_question' course instance %}">+
      </button>
    </div>
  </div>
</div>
