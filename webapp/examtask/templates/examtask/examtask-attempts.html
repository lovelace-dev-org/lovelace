{% load i18n %}
{% load static %}

<div class="examtask-attempts-panel">
  {% for attempt in attempts %}
    <div class="item-header">
      {{ attempt.title|truncatechars:80 }}
      <span class="item-config-actions">
        <a class="right-float interactive"
            onclick="editing.get_form(event, this)"
            data-url="{% url 'examtask:delete_task_attempt' course instance content attempt.id %}"
            ><img src="{% static 'courses/delete-16.png' %}"></a>
        <a class="right-float interactive"
            onclick="editing.get_form(event, this)"
            data-url="{% url 'examtask:edit_task_attempt' course instance content attempt.id %}"
            ><img src="{% static 'courses/edit.png' %}"></a>
      </span>
    </div>
  {% endfor %}
  <button type="button"
          class="staff-base-button add-button"
          onclick="editing.get_form(event, this)"
          data-url="{% url 'examtask:add_task_attempt' course instance content %}">+
  </button>
</div>
